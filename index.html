
<!-- Sarupya Ojha - CSE 230 Image Slider Assignment -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlands Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="stage">
        <header class="stage__head">
            <p class="eyebrow">Photo carousel</p>
            <h1>Highlands, in five frames</h1>
            <p class="stage__lead">
                A dependency-free carousel with captions, a slide counter and an
                endless loop in both directions.
            </p>
        </header>

        <!-- Only the slides are written by hand.
             Arrows, dots and the counter are generated by slider.js -->
        <section class="carousel" id="highlands"
                 aria-roledescription="carousel"
                 aria-label="Highland landscapes">
            <div class="carousel__window">
                <ul class="carousel__rail">
                    <li class="carousel__item">
                        <figure>
                            <img src="https://picsum.photos/seed/ridge/1280/720" alt="Mountain ridge above low cloud">
                            <figcaption><strong>Cloud line</strong><span>First light on the upper ridge.</span></figcaption>
                        </figure>
                    </li>
                    <li class="carousel__item">
                        <figure>
                            <img src="https://picsum.photos/seed/lake/1280/720" alt="Still lake reflecting a hillside">
                            <figcaption><strong>Still water</strong><span>A windless lake at midday.</span></figcaption>
                        </figure>
                    </li>
                    <li class="carousel__item">
                        <figure>
                            <img src="https://picsum.photos/seed/pines/1280/720" alt="Pine forest on a steep slope">
                            <figcaption><strong>Pine slope</strong><span>Dark timber climbing the valley wall.</span></figcaption>
                        </figure>
                    </li>
                    <li class="carousel__item">
                        <figure>
                            <img src="https://picsum.photos/seed/trail/1280/720" alt="Narrow trail across open moorland">
                            <figcaption><strong>Open moor</strong><span>The trail disappears over the rise.</span></figcaption>
                        </figure>
                    </li>
                    <li class="carousel__item">
                        <figure>
                            <img src="https://picsum.photos/seed/dusk/1280/720" alt="Valley glowing at dusk">
                            <figcaption><strong>Dusk</strong><span>The valley holds the last of the light.</span></figcaption>
                        </figure>
                    </li>
                </ul>
            </div>
        </section>

        <p class="stage__hint">Use the arrows, the dots, the left/right keys, or swipe.</p>
    </main>

    <script src="slider.js"></script>
    <script>
        // speed: slide duration in ms. autoplay: ms between slides (0 = off).
        new Carousel('#highlands', { speed: 650, autoplay: 0 });
    </script>
</body>
</html>
