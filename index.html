<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Slider</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>

    <main class="page-container">
        <h1>Responsive Image Slider</h1>
        <p class="description">
            Explore beautiful images using the navigation arrows and dots.
        </p>

        <section class="slider-container" aria-label="Image gallery">
            <div class="slider-viewport">
                <div class="slider-track">
                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
                            alt="Beautiful green valley surrounded by mountains">
                    </div>

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
                            alt="Mountain landscape reflected in a lake">
                    </div>

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=85"
                            alt="Scenic lake surrounded by mountains">
                    </div>

                    <div class="slide">
                        <img
                            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85"
                            alt="Snow-covered mountain peaks under the sky">
                    </div>
                </div>
            </div>

            <button
                class="slider-button previous"
                type="button"
                aria-label="Previous image">
                &#10094;
            </button>

            <button
                class="slider-button next"
                type="button"
                aria-label="Next image">
                &#10095;
            </button>
        </section>

        <div class="slider-dots" aria-label="Choose an image"></div>

        <p class="slide-counter" aria-live="polite">
            Image 1 of 4
        </p>
    </main>

</body>
</html>
