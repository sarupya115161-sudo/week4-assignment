<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider Library</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page">
        <h1>Image Slider Library</h1>
        <p class="page__intro">
            A vanilla JavaScript carousel with infinite looping, indicator dots,
            and hardware-accelerated sliding.
        </p>

        <!-- Slider markup: only the slides are written by hand.
             Arrows, dots and loop clones are generated by slider.js -->
        <section class="slider" id="gallery" aria-label="Featured landscapes">
            <div class="slider__viewport">
                <ul class="slider__track">
                    <li class="slider__slide">
                        <img src="https://picsum.photos/seed/mountain/1200/675" alt="Mountain landscape" loading="lazy">
                    </li>
                    <li class="slider__slide">
                        <img src="https://picsum.photos/seed/forest/1200/675" alt="Forest path" loading="lazy">
                    </li>
                    <li class="slider__slide">
                        <img src="https://picsum.photos/seed/ocean/1200/675" alt="Ocean shoreline" loading="lazy">
                    </li>
                    <li class="slider__slide">
                        <img src="https://picsum.photos/seed/desert/1200/675" alt="Desert dunes" loading="lazy">
                    </li>
                    <li class="slider__slide">
                        <img src="https://picsum.photos/seed/city/1200/675" alt="City skyline" loading="lazy">
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <script src="slider.js"></script>
    <script>
        // Initialise the slider on the container
        new ImageSlider('#gallery', { duration: 500 });
    </script>
</body>
</html>
